name: Deploy FastAPI to DigitalOcean

on:
  push:
    branches:
      - main # Triggers the workflow when you push to the main branch

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_PASSPHRASE }}
          script: |
            # 1. Navigate to the project directory
            cd /root/markitdown-service
            
            # 2. Pull the latest code from GitHub
            git pull origin main
            
            # 3. Activate your virtual environment
            # (Change 'venv' if your virtual environment folder has a different name)
            source venv/bin/activate
            
            # 4. Install any new dependencies added to requirements.txt
            pip install -r requirements.txt
            
            # 5. Restart the FastAPI background service
            # (Change 'fastapi.service' to the actual name of your systemd service file)
            sudo systemctl restart markitdown
